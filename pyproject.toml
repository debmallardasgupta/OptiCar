[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opticar"
version = "1.0.0"
description = "Used-car price prediction: scikit-learn pipeline with a CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
opticar = "opticar.cli:main"

[tool.setuptools.packages.find]
include = ["opticar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
